name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: 📦 Install Mobile Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: ⚙️ Generate Native Android Code (Expo Prebuild)
        working-directory: ./mobile
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Configure Release Signing with Debug Keystore
        working-directory: ./mobile/android
        run: |
          # Configure release build to use debug signing key so APK installs on any device without keystore setup
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.debug/g' app/build.gradle
          sed -i 's/buildTypes {/buildTypes {\n        release {\n            signingConfig signingConfigs.debug\n        }/g' app/build.gradle || true

      - name: 📦 Bundle JS & Build Standalone Release APK
        working-directory: ./mobile/android
        run: ./gradlew assembleRelease --no-daemon -x lint

      - name: 📋 Copy & Rename APK
        run: |
          mkdir -p build_output
          if [ -f mobile/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp mobile/android/app/build/outputs/apk/release/app-release.apk build_output/Keltron-MPP-EMS.apk
          elif [ -f mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk build_output/Keltron-MPP-EMS.apk
          else
            find mobile/android/app/build/outputs/apk -name "*.apk" -exec cp {} build_output/Keltron-MPP-EMS.apk \;
          fi

      - name: 💾 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Keltron-MPP-EMS-APK
          path: build_output/Keltron-MPP-EMS.apk
          if-no-files-found: error

      - name: 🚀 Publish Direct Download GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-latest
          name: Keltron MPP EMS - Latest Android APK (Release Standalone)
          body: |
            ### 📱 Keltron MPP EMS - Standalone Release Android APK
            - **Fully Bundled Release APK**: All JavaScript scripts and images are embedded inside `index.android.bundle` (NO Metro or dev server required).
            - **Automated Geofence Punch In / Out** within 700m Keltron Kannur Plant boundary.
            - **Runs in background 24/7** with persistent Android Foreground Service.
            - **High-Priority Push Notification Alerts** on Auto-Punch.
            - **Accurate 7.5h Working Hours & OT Logic**.
            - **MPP SINCE 2026 Official Logo**.
          files: build_output/Keltron-MPP-EMS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
