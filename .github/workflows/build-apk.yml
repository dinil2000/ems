name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: 📦 Install Mobile Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: ⚙️ Generate Native Android Code (Expo Prebuild)
        working-directory: ./mobile
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build Standalone Android APK
        working-directory: ./mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: 📋 Copy & Rename APK
        run: |
          mkdir -p build_output
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk build_output/Keltron-MPP-EMS.apk

      - name: 💾 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Keltron-MPP-EMS-APK
          path: build_output/Keltron-MPP-EMS.apk
          if-no-files-found: error

      - name: 🚀 Publish Direct Download GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-latest
          name: Keltron MPP EMS - Latest Android APK
          body: |
            ### 📱 Keltron MPP EMS - Standalone Android APK for All Employees
            - **Automated Geofence Punch In / Out** within 700m Keltron Kannur Plant boundary.
            - **Runs in background 24/7** with persistent Android Foreground Service.
            - **High-Priority Push Notification Alerts** on Auto-Punch.
            - **Accurate 7.5h Working Hours & OT Logic**.
            - **MPP SINCE 2026 Official Logo**.
          files: build_output/Keltron-MPP-EMS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
