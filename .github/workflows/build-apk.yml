name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: 📦 Install Mobile Dependencies
        working-directory: ./mobile
        run: npm install

      - name: ⚙️ Generate Native Android Code (Expo Prebuild)
        working-directory: ./mobile
        run: npx expo prebuild --platform android --clean

      - name: 🔐 Generate Official Production Keystore & Configure Release Signing
        working-directory: ./mobile/android
        run: |
          # 1. Create official 2048-bit RSA production keystore
          keytool -genkeypair -v \
            -keystore app/keltron-release.keystore \
            -alias keltron \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass keltron2026 \
            -keypass keltron2026 \
            -dname "CN=Keltron MPP EMS, OU=EMS Enterprise, O=Keltron Component Complex Ltd, L=Kannur, ST=Kerala, C=IN"

          # 2. Inject official production signing config into app/build.gradle
          python3 -c "
          with open('app/build.gradle', 'r') as f:
              content = f.read()

          signing_block = '''
              release {
                  storeFile file('keltron-release.keystore')
                  storePassword 'keltron2026'
                  keyAlias 'keltron'
                  keyPassword 'keltron2026'
                  v1SigningEnabled true
                  v2SigningEnabled true
              }
          '''
          content = content.replace('signingConfigs {', 'signingConfigs {' + signing_block)
          content = content.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
          
          # Ensure release build type uses the release signing config
          if 'signingConfig signingConfigs.release' not in content:
              content = content.replace('buildTypes {', 'buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }')

          with open('app/build.gradle', 'w') as f:
              f.write(content)
          "

      - name: 📦 Bundle JS & Build Signed Production Release APK
        working-directory: ./mobile/android
        run: ./gradlew assembleRelease --no-daemon -x lint

      - name: 📋 Copy & Rename APK
        run: |
          mkdir -p build_output
          if [ -f mobile/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp mobile/android/app/build/outputs/apk/release/app-release.apk build_output/Keltron-MPP-EMS.apk
          elif [ -f mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk build_output/Keltron-MPP-EMS.apk
          else
            find mobile/android/app/build/outputs/apk -name "*.apk" -exec cp {} build_output/Keltron-MPP-EMS.apk \;
          fi

      - name: 💾 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Keltron-MPP-EMS-APK
          path: build_output/Keltron-MPP-EMS.apk
          if-no-files-found: error

      - name: 🚀 Publish Direct Download GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-latest
          name: Keltron MPP EMS - Latest Signed Android APK (Official Release)
          body: |
            ### 📱 Keltron MPP EMS - Officially Signed Standalone Android APK
            - **Officially Signed Release APK**: Signed with RSA 2048-bit V1/V2 production certificate (`Keltron Component Complex Ltd`).
            - **Fully Bundled**: Offline standalone binary with embedded JavaScript logic & assets.
            - **Automated Geofence Attendance**: Dual-boundary hysteresis (700m Enter / 850m Exit) & 3-reading debounce.
            - **Persistent Background Foreground Service**: Runs 24/7 with high-priority auto-punch push alerts.
            - **1-Tap Battery Optimization Dialog**.
          files: build_output/Keltron-MPP-EMS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
