name: Build Android APK & AAB Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: 📦 Install Mobile Dependencies
        working-directory: ./mobile
        run: npm install

      - name: ⚙️ Generate Native Android Code (Expo Prebuild)
        working-directory: ./mobile
        run: npx expo prebuild --platform android --clean

      - name: 🔐 Generate Official Production Keystore & Configure Release Signing
        working-directory: ./mobile/android
        run: |
          # 1. Create official 2048-bit RSA production keystore
          keytool -genkeypair -v \
            -keystore app/keltron-release.keystore \
            -alias keltron \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass keltron2026 \
            -keypass keltron2026 \
            -dname "CN=Keltron MPP EMS, OU=EMS Enterprise, O=Keltron Component Complex Ltd, L=Kannur, ST=Kerala, C=IN"

          # 2. Inject official production signing config into app/build.gradle
          python3 -c "
          with open('app/build.gradle', 'r') as f:
              content = f.read()

          signing_block = '''
              release {
                  storeFile file('keltron-release.keystore')
                  storePassword 'keltron2026'
                  keyAlias 'keltron'
                  keyPassword 'keltron2026'
                  v1SigningEnabled true
                  v2SigningEnabled true
              }
          '''
          content = content.replace('signingConfigs {', 'signingConfigs {' + signing_block)
          content = content.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
          
          # Ensure release build type uses the release signing config
          if 'signingConfig signingConfigs.release' not in content:
              content = content.replace('buildTypes {', 'buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }')

          with open('app/build.gradle', 'w') as f:
              f.write(content)
          "

      - name: 📦 Build Signed Production Release APK
        working-directory: ./mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -x lint

      - name: 📦 Build Signed Google Play AAB Bundle
        working-directory: ./mobile/android
        run: ./gradlew bundleRelease --no-daemon --stacktrace -x lint

      - name: 📋 Copy & Rename Output Files
        run: |
          mkdir -p build_output

          # Copy APK
          if [ -f mobile/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp mobile/android/app/build/outputs/apk/release/app-release.apk build_output/Keltron-MPP-EMS.apk
          elif [ -f mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk build_output/Keltron-MPP-EMS.apk
          else
            find mobile/android/app/build/outputs/apk -name "*.apk" -exec cp {} build_output/Keltron-MPP-EMS.apk \;
          fi

          # Copy AAB Bundle for Google Play Console
          if [ -f mobile/android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp mobile/android/app/build/outputs/bundle/release/app-release.aab build_output/Keltron-MPP-EMS.aab
          elif [ -f mobile/android/app/build/outputs/bundle/release/app-release-unsigned.aab ]; then
            cp mobile/android/app/build/outputs/bundle/release/app-release-unsigned.aab build_output/Keltron-MPP-EMS.aab
          else
            find mobile/android/app/build/outputs/bundle -name "*.aab" -exec cp {} build_output/Keltron-MPP-EMS.aab \;
          fi

      - name: 💾 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Keltron-MPP-EMS-Binaries
          path: |
            build_output/Keltron-MPP-EMS.apk
            build_output/Keltron-MPP-EMS.aab
          if-no-files-found: error

      - name: 🚀 Publish Direct Download GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-latest
          name: Keltron MPP EMS - Signed Android APK & Google Play AAB Bundle
          body: |
            ### 📱 Keltron MPP EMS - Production Release Binaries
            - **Google Play Store AAB Bundle**: `Keltron-MPP-EMS.aab` (Upload this file directly to Google Play Console).
            - **Standalone Release APK**: `Keltron-MPP-EMS.apk` (Direct device download and sideloading).
            - **Production Certificate**: Signed with RSA 2048-bit V1/V2 production certificate (`Keltron Component Complex Ltd`).
            - **24/7 Background Geofence Attendance**: Persistent foreground service for all shifts (Shift 1, Shift 2, Shift 3, General).
            - **Shift Alarm Manager & 7.30h Working Hours**: 30-minute lunch break deduction and shift window alerts.
            - **Privacy Policy**: [https://mppems.vercel.app/privacy-policy](https://mppems.vercel.app/privacy-policy).
          files: |
            build_output/Keltron-MPP-EMS.apk
            build_output/Keltron-MPP-EMS.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
